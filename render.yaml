# render.yaml — Render Blueprint for Agentic AI DSL Colab
# Deploy: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Render reads this file and creates the service. It will PROMPT you for the
# secret values marked "sync: false" (your Gmail address + App Password).
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: agentic-colab
    runtime: docker            # if your Render account errors on this, change to: env: docker
    plan: free                 # free tier works fully; see RENDER_STEPS.md to add a disk for persistence
    region: singapore          # closest Render region to India
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true           # redeploy automatically on every git push

    envVars:
      # --- App config (safe to commit) ---
      - key: MPLBACKEND
        value: Agg
      - key: COLAB_DATA_DIR
        value: /data
      - key: ENABLE_2FA
        value: "true"

      # --- Database: persists notebooks + user accounts even on the free tier ---
      # Set this in the Render dashboard to your Neon connection string
      # (Environment → DATABASE_URL). Marked sync:false so Render does NOT manage
      # or overwrite it. If left blank, the app falls back to local SQLite.
      - key: DATABASE_URL
        sync: false

      # --- Email for OTP (registration / 2FA / password reset) ---
      # Render BLOCKS outbound SMTP, so we send via Brevo's HTTP API (port 443).
      # Get a free key at https://www.brevo.com (300 emails/day, no card).
      # Set BREVO_API_KEY and MAIL_FROM in the dashboard (see RENDER_STEPS.md).
      - key: MAIL_FROM           # your verified Brevo sender, e.g. you@gmail.com
        sync: false
      - key: MAIL_FROM_NAME
        value: Agentic AI DSL Colab
      - key: BREVO_API_KEY       # xkeysib-... from Brevo
        sync: false

      # --- Flask session secret: Render auto-generates a strong random value ---
      - key: COLAB_SECRET
        generateValue: true

      # --- Optional: only if you use Google sign-in ---
      - key: OAUTH_REDIRECT_BASE  # set to your https://...onrender.com URL after first deploy
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

    # --- Persistent storage (PAID plan only) ---
    # Free tier has an ephemeral disk (notebooks reset on restart/redeploy).
    # To keep data permanently: change `plan: free` to `plan: starter` above,
    # then UNCOMMENT the disk block below and redeploy.
    #
    # disk:
    #   name: colab-data
    #   mountPath: /data
    #   sizeGB: 1

# Persistent database: this project uses Neon (https://neon.tech) — a permanently
# free external PostgreSQL. You set its connection string as the DATABASE_URL
# environment variable in the Render dashboard (see deploy/RENDER_STEPS.md).
# Nothing to define here — Neon lives outside Render, so your data is never tied
# to the web service's disk.
