<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Agentic AI DSL Colab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 32'%3E%3Cpath d='M21 7.34A10 10 0 1 0 21 24.66' fill='none' stroke='%23F9AB00' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='16' r='10' fill='none' stroke='%23E8710A' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/colab.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="co-logo">
      <span class="co-mark" aria-hidden="true">
        <svg viewBox="0 0 56 32" width="56" height="32" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F9AB00"/><stop offset="1" stop-color="#E8710A"/>
          </linearGradient></defs>
          <path d="M21 7.34A10 10 0 1 0 21 24.66" fill="none" stroke="url(#cg)" stroke-width="6" stroke-linecap="round"/>
          <circle cx="40" cy="16" r="10" fill="none" stroke="url(#cg)" stroke-width="6"/>
        </svg>
      </span>
    </div>
    <h1 style="font-size:22px">Set a new password</h1>
    <p class="sub" id="sub">Enter your new password below.</p>

    <div id="error" class="auth-error" style="display:none"></div>
    <div id="success" class="auth-success" style="display:none"></div>

    <form id="reset-form">
      <label class="field-label" for="password">New password <span style="color:#80868b">(min 8 chars)</span></label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
      <label class="field-label" for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
      <button type="submit" class="btn-primary" id="submit-btn">Reset password</button>
    </form>

    <p class="auth-links" style="margin-top:18px">
      Remembered it? <a href="{{ url_for('login') }}">Back to sign in</a>
    </p>
  </div>
</div>

<script>
  const SUPABASE_URL = {{ supabase_url | tojson }};
  const SUPABASE_ANON_KEY = {{ supabase_anon_key | tojson }};

  // Supabase sends the recovery token in the URL fragment (#access_token=...&type=recovery).
  // The fragment is browser-only — the server never sees it.
  const params = new URLSearchParams(window.location.hash.slice(1));
  const accessToken = params.get("access_token");
  const type = params.get("type");
  const linkError = params.get("error_description") || params.get("error");

  const formEl    = document.getElementById("reset-form");
  const errorEl   = document.getElementById("error");
  const successEl = document.getElementById("success");
  const subEl     = document.getElementById("sub");
  const btnEl     = document.getElementById("submit-btn");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }
  function hideError() { errorEl.style.display = "none"; }

  if (linkError) {
    showError("This password-reset link is invalid or has expired. Request a new one.");
    formEl.style.display = "none";
    subEl.innerHTML = 'Need a fresh link? <a href="{{ url_for("auth_forgot_password") }}">Send another reset email</a>.';
  } else if (type !== "recovery" || !accessToken) {
    showError("Open the password-reset link from your email to use this page.");
    formEl.style.display = "none";
    subEl.innerHTML = 'No reset token in URL. <a href="{{ url_for("auth_forgot_password") }}">Request a reset email</a>.';
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();
    const pwd = document.getElementById("password").value;
    const conf = document.getElementById("confirm").value;
    if (pwd.length < 8) { showError("Password must be at least 8 characters."); return; }
    if (pwd !== conf)   { showError("Passwords do not match."); return; }

    btnEl.disabled = true;
    btnEl.textContent = "Resetting…";

    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/user", {
        method: "PUT",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ password: pwd }),
      });
      if (res.ok) {
        formEl.style.display = "none";
        successEl.textContent = "Password updated. Redirecting to sign in…";
        successEl.style.display = "block";
        setTimeout(() => { window.location.href = "{{ url_for('login') }}"; }, 1500);
      } else {
        const body = await res.json().catch(() => ({}));
        showError(body.msg || body.message || body.error_description || ("Could not update password (HTTP " + res.status + ")."));
        btnEl.disabled = false;
        btnEl.textContent = "Reset password";
      }
    } catch (err) {
      showError("Network error: " + err.message);
      btnEl.disabled = false;
      btnEl.textContent = "Reset password";
    }
  });
</script>
</body>
</html>
