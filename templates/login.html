<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Agentic AI DSL Colab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 32'%3E%3Cpath d='M21 7.34A10 10 0 1 0 21 24.66' fill='none' stroke='%23F9AB00' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='16' r='10' fill='none' stroke='%23E8710A' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/colab.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="co-logo">
      <span class="co-mark" aria-hidden="true">
        <svg viewBox="0 0 56 32" width="56" height="32" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F9AB00"/><stop offset="1" stop-color="#E8710A"/>
          </linearGradient></defs>
          <path d="M21 7.34A10 10 0 1 0 21 24.66" fill="none" stroke="url(#cg)" stroke-width="6" stroke-linecap="round"/>
          <circle cx="40" cy="16" r="10" fill="none" stroke="url(#cg)" stroke-width="6"/>
        </svg>
      </span>
    </div>
    <h1>Agentic AI DSL Colab</h1>
    <p class="sub">Notebooks with Python &amp; AIDL, plus an agentic assistant.</p>

    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

    <!-- Supabase email/password login -->
    <form method="post" action="{{ url_for('auth_password_login') }}" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com"
               autocomplete="email" required value="{{ prefill_email or '' }}">
      </div>
      <div class="field" style="position:relative">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password"
               autocomplete="current-password" required>
        <button type="button" class="pwd-toggle" onclick="togglePwd(this)" tabindex="-1" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        </button>
      </div>
      <div class="auth-links">
        <a href="{{ url_for('auth_forgot_password') }}" class="auth-link">Forgot password?</a>
      </div>
      <button class="btn primary" type="submit" style="width:100%;height:44px;justify-content:center;margin-top:8px">
        Sign in
      </button>
    </form>

    <div class="divider">new here?</div>
    <a href="{{ url_for('auth_register') }}" class="btn" style="width:100%;height:40px;justify-content:center;text-decoration:none">
      Create an account
    </a>

    <p class="login-note">Your notebooks, outputs and datasets are saved to your account.</p>
  </div>
</div>
<script>
function togglePwd(btn) {
  const inp = btn.previousElementSibling;
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
